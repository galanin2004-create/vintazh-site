name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pages отдаёт сайт из подпапки /vintazh-site, поэтому нужен basePath.
      # NEXT_PUBLIC_SITE_URL правит canonical и sitemap под этот адрес —
      # когда появится свой домен, обе переменные убираются.
      - name: Сборка статики
        env:
          STATIC_EXPORT: "1"
          BASE_PATH: "/vintazh-site"
          NEXT_PUBLIC_BASE_PATH: "/vintazh-site"
          NEXT_PUBLIC_SITE_URL: "https://galanin2004-create.github.io/vintazh-site"
        run: npm run build

      # Без этого файла Pages прячет папку _next и страница остаётся без стилей.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
