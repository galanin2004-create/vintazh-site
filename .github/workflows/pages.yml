name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # CRM дёргает это событие после «Опубликовать» в приёмке
  repository_dispatch:
    types: [crm-publish]
  # Страховка, если токен GitHub в CRM не задан или сломался: раз в сутки
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Вещи, принятые через Telegram-бота, живут в CRM: забираем их
      # вместе с кадрами перед сборкой. CRM молчит — сборка падает, и на
      # Pages остаётся прошлая версия, а не витрина без вещей.
      - name: Вещи из CRM
        env:
          CRM_URL: "https://vintazh-crm.site-chas.ru"
        run: node scripts/pull-crm-items.mjs

      # Сайт живёт на своём домене (Pages с custom domain), поэтому basePath
      # не нужен. NEXT_PUBLIC_SITE_URL правит canonical и sitemap; когда
      # у галереи появится собственный домен — поменять здесь и в lib/site.ts.
      - name: Сборка статики
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_SITE_URL: "https://vintazh.site-chas.ru"
          # Адрес CRM на хостинге Рег.ру: сюда уходят брони, отсюда берётся
          # занятость вещей. Уберёте переменную — форма снова откроет Telegram.
          NEXT_PUBLIC_CRM_URL: "https://vintazh-crm.site-chas.ru"
        run: npm run build

      # Без этого файла Pages прячет папку _next и страница остаётся без стилей.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
